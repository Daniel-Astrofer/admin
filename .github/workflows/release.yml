name: Release kerosene-jctl

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload assets to the published release.
      id-token: write # Required for keyless signing and provenance.
      attestations: write # Required to publish build provenance.
      artifact-metadata: write # Required to associate provenance with artifacts.
    uses: Daniel-Astrofer/.github/.github/workflows/java-release.yml@c20b6773eaf68590ac128403c6959e0c758af1e4
    with:
      package: kerosene-jctl
